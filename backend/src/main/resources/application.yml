server:
  port: 8080
  servlet:
    context-path: /api
spring:
  # Spring Boot does not load dotenv files by default. Resolve the single root
  # .env when launched from either the repository root or backend/.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/Tour}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-at-least-thirty-two-characters}
  frontend-origin: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000}}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
